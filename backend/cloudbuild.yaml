# =====================================================================
#  Cloud Build — build the backend image and deploy it to Cloud Run.
#
#  Run from the repo root (quote the substitutions — required on PowerShell):
#    gcloud builds submit --config backend/cloudbuild.yaml \
#      --substitutions="_REGION=europe-west1,_SERVICE=nexus-ai-api"
#
#  Secrets (GROQ_API_KEY, JWT_SECRET) are read from Secret Manager at
#  deploy time — create them first:
#    echo -n "YOUR_GROQ_KEY" | gcloud secrets create GROQ_API_KEY --data-file=-
#    echo -n "$(openssl rand -hex 32)" | gcloud secrets create JWT_SECRET --data-file=-
# =====================================================================
substitutions:
  _REGION: europe-west1
  _SERVICE: nexus-ai-api

steps:
  # 1 — Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nexus/${_SERVICE}:$BUILD_ID
      - backend

  # 2 — Push it to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nexus/${_SERVICE}:$BUILD_ID

  # 3 — Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/nexus/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --set-env-vars=USE_FIRESTORE=true,APP_URL=https://nexus-ai-608af.web.app,FREE_DAILY_LIMIT=20
      # To enable the Stripe subscription, create the 3 secrets (see DEPLOY.md)
      # then append them here:
      #   ,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_PRICE_ID=STRIPE_PRICE_ID:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest
      # To enable server push notifications, create the VAPID secrets (see
      # DEPLOY.md section 6) then append them here:
      #   ,VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest
      - --set-secrets=GROQ_API_KEY=GROQ_API_KEY:latest,JWT_SECRET=JWT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nexus/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
